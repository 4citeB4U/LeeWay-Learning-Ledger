name: Chronos ledger regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ledger-guard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/http-admission-service.test.mjs
