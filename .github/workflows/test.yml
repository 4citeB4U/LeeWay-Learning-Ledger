name: Experiential candidate source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Qualify Learning-only source readiness inventory (never grants production)
        run: npm run assess:independent-readiness
      - name: Verify canonical engineering loop documentation
        run: npm run verify:engineering-loop
