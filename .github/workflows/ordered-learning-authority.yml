name: LeeWay Ordered Learning Authority
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  learning-stage-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/learning-stage-conformance.test.mjs
